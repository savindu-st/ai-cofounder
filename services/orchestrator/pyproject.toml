[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator-service"
version = "0.1.0"
description = "Central LangGraph Orchestrator Monolith for AI Co-Founder"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "langgraph>=0.0.26",
    "redis>=5.0.0",
    "pydantic>=2.6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
