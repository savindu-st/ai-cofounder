[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-service"
version = "0.1.0"
description = "Marketing and Output Export Domain for AI Co-Founder"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.0",
    "reportlab>=4.1.0",
    "jinja2>=3.1.3",
    "pydantic>=2.6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
