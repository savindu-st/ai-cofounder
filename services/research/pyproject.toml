[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-service"
version = "0.1.0"
description = "Market Research and Critic Validation Domain for AI Co-Founder"
requires-python = ">=3.11"
dependencies = [
    "tavily-python>=0.3.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
